<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма обратной связи</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2 class="header">Форма обратной связи</h2>
        <form action="process_feedback.php" method="post">
            <div class="input-group">
                <label for="first_name">Имя:</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>

            <div class="input-group">
                <label for="last_name">Фамилия:</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>

            <div class="input-group">
                <label for="email">Электронная почта:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="input-group">
                <label for="feedback">Обратная связь:</label>
                <textarea id="feedback" name="feedback" rows="4" required></textarea>
            </div>

            <div class="input-group">
                <p class="question-title">Как вы узнали о нас?</p>
                <div class="option-group">
                    <input type="radio" id="internet" name="source" value="Интернет" required>
                    <label for="internet">Интернет</label>
                    <input type="radio" id="friend" name="source" value="Друзья" required>
                    <label for="friend">Друзья</label>
                </div>
            </div>

            <div class="input-group">
                <p class="question-title">Какие услуги вас интересуют?</p>
                <div class="option-group">
                    <input type="checkbox" id="service1" name="services[]" value="Flow Yoga">
                    <label for="service1">Flow Yoga</label>
                    <input type="checkbox" id="service2" name="services[]" value="Pilates Reformer">
                    <label for="service2">Pilates Reformer</label>
                    <input type="checkbox" id="service3" name="services[]" value="Stretching">
                    <label for="service3">Stretching</label>
                </div>
            </div>

            <div class="input-group">
                <input type="submit" value="Отправить">
            </div>
        </form>
    </div>
</body>
</html>
